<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create a heatmap layer</title>
    <meta property="og:description" content="Show the density of earthquake locations on a map, weighted by magnitude." />
    <meta property="og:category" content="Heatmaps & Clusters" />
    <meta property="og:order" content="1" />
    <meta property="og:created" content="2025-06-25" />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='../../dist/maplibre-gl.css' />

    <style>
        body { margin: 0; padding: 0; font: 13px/1.4 system-ui, sans-serif; }
        html, body, #map { height: 100%; }
        #panel {
            position: absolute; top: 10px; left: 10px; width: 220px;
            padding: 10px 12px; background: rgba(255, 255, 255, 0.95); border-radius: 6px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }
        h1 { font-size: 14px; margin: 0 0 2px; }
        p { margin: 0 0 10px; color: #555; }
        .row { margin: 4px 0 10px; }
        .row:last-child { margin-bottom: 0; }
        .row label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; }
        .row label output { font-weight: 400; color: #555; }
        input[type=range], select { width: 100%; margin: 0; }
        #ramp { height: 8px; border-radius: 2px; margin-top: 6px; }
    </style>
</head>
<body>
<div id="map"></div>
<div id="panel">
    <h1>Earthquakes, <span style="white-space: nowrap">Sep–Oct 2017</span></h1>
    <p>A month of earthquakes worldwide, weighted by magnitude.</p>
    <div class="row">
        <label for="radius">Radius at zoom 9 <output id="radius-value"></output></label>
        <input id="radius" type="range" min="5" max="60" step="1" value="20">
    </div>
    <div class="row">
        <label for="colors">Colours</label>
        <select id="colors">
            <option value="blueRed">Blue to red</option>
            <option value="default">Default</option>
            <option value="fire">Fire</option>
            <option value="viridis">Viridis</option>
            <option value="blues">Blues</option>
        </select>
        <div id="ramp"></div>
    </div>
</div>

<script type="module">
    import * as maplibregl from '../../dist/maplibre-gl-dev.mjs';

    // Colour ramps as stops from 0 (low density) to 1 (high). Each begins with a transparent colour,
    // so that the heatmap fades out at its edges. `default` is the ramp a heatmap gets when
    // heatmap-color is not set.
    const RAMPS = {
        blueRed: [[0, 'rgba(33,102,172,0)'], [0.2, 'rgb(103,169,207)'], [0.4, 'rgb(209,229,240)'], [0.6, 'rgb(253,219,199)'], [0.8, 'rgb(239,138,98)'], [1, 'rgb(178,24,43)']],
        default: [[0, 'rgba(0,0,255,0)'], [0.1, 'royalblue'], [0.3, 'cyan'], [0.5, 'lime'], [0.7, 'yellow'], [1, 'red']],
        fire: [[0, 'rgba(255,255,178,0)'], [0.15, '#fed976'], [0.4, '#fd8d3c'], [0.7, '#e31a1c'], [1, '#800026']],
        viridis: [[0, 'rgba(68,1,84,0)'], [0.1, '#440154'], [0.35, '#31688e'], [0.6, '#35b779'], [1, '#fde725']],
        blues: [[0, 'rgba(222,235,247,0)'], [0.2, '#c6dbef'], [0.5, '#6baed6'], [0.8, '#2171b5'], [1, '#08306b']]
    };

    /** Colours the heatmap by density with the given stops. */
    function heatmapColor(stops) {
        return ['interpolate', ['linear'], ['heatmap-density'], ...stops.flat()];
    }

    /** Colours a circle by magnitude with the same stops, magnitude 1 to 6 taking the place of density 0 to 1. */
    function circleColor(stops) {
        return ['interpolate', ['linear'], ['get', 'mag'], ...stops.flatMap(([density, color]) => [1 + 5 * density, color])];
    }

    /** Grows the heatmap radius with zoom, reaching `radius` pixels at zoom 9. */
    function heatmapRadius(radius) {
        return ['interpolate', ['linear'], ['zoom'], 0, radius / 10, 9, radius];
    }

    function rampPreview(stops) {
        return `linear-gradient(to right, ${stops.map(([density, color]) => `${color} ${density * 100}%`).join(', ')})`;
    }

    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://demotiles.maplibre.org/style.json',
        center: [-120, 50],
        zoom: 2
    });

    map.on('load', () => {
        // Earthquakes of 8 September to 8 October 2017 from the USGS earthquake catalog (public domain):
        // https://earthquake.usgs.gov/earthquakes/search/
        // Heatmap layers also work with a vector tile source.
        map.addSource('earthquakes', {
            'type': 'geojson',
            'data':
                'https://maplibre.org/maplibre-gl-js/docs/assets/earthquakes.geojson',
            'attribution': 'Earthquakes: <a href="https://earthquake.usgs.gov/">U.S. Geological Survey</a>'
        });

        map.addLayer(
            {
                'id': 'earthquakes-heat',
                'type': 'heatmap',
                'source': 'earthquakes',
                'maxzoom': 9,
                'paint': {
                    // Increase the heatmap weight based on frequency and property magnitude
                    'heatmap-weight': [
                        'interpolate',
                        ['linear'],
                        ['get', 'mag'],
                        0,
                        0,
                        6,
                        1
                    ],
                    // Increase the heatmap color weight weight by zoom level
                    // heatmap-intensity is a multiplier on top of heatmap-weight
                    'heatmap-intensity': [
                        'interpolate',
                        ['linear'],
                        ['zoom'],
                        0,
                        1,
                        9,
                        3
                    ],
                    // Color ramp for heatmap.  Domain is 0 (low) to 1 (high).
                    'heatmap-color': heatmapColor(RAMPS.blueRed),
                    // Adjust the heatmap radius by zoom level
                    'heatmap-radius': heatmapRadius(20),
                    // Transition from heatmap to circle layer by zoom level
                    'heatmap-opacity': [
                        'interpolate',
                        ['linear'],
                        ['zoom'],
                        7,
                        1,
                        9,
                        0
                    ]
                }
            }
        );

        map.addLayer(
            {
                'id': 'earthquakes-point',
                'type': 'circle',
                'source': 'earthquakes',
                'minzoom': 7,
                'paint': {
                    // Size circle radius by earthquake magnitude and zoom level
                    'circle-radius': [
                        'interpolate',
                        ['linear'],
                        ['zoom'],
                        7,
                        ['interpolate', ['linear'], ['get', 'mag'], 1, 1, 6, 4],
                        16,
                        ['interpolate', ['linear'], ['get', 'mag'], 1, 5, 6, 50]
                    ],
                    // Color circle by earthquake magnitude
                    'circle-color': circleColor(RAMPS.blueRed),
                    'circle-stroke-color': 'white',
                    'circle-stroke-width': 1,
                    // Transition from heatmap to circle layer by zoom level
                    'circle-opacity': [
                        'interpolate',
                        ['linear'],
                        ['zoom'],
                        7,
                        0,
                        8,
                        1
                    ]
                }
            }
        );

        const radius = document.getElementById('radius');
        const radiusValue = document.getElementById('radius-value');
        radiusValue.textContent = `${radius.value} px`;
        radius.addEventListener('input', () => {
            map.setPaintProperty('earthquakes-heat', 'heatmap-radius', heatmapRadius(Number(radius.value)));
            radiusValue.textContent = `${radius.value} px`;
        });

        const colors = document.getElementById('colors');
        const ramp = document.getElementById('ramp');
        ramp.style.background = rampPreview(RAMPS.blueRed);
        colors.addEventListener('change', () => {
            const stops = RAMPS[colors.value];
            map.setPaintProperty('earthquakes-heat', 'heatmap-color', heatmapColor(stops));
            map.setPaintProperty('earthquakes-point', 'circle-color', circleColor(stops));
            ramp.style.background = rampPreview(stops);
        });
    });
</script>
</body>
</html>

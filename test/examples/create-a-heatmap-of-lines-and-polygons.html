<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create a heatmap of lines and polygons</title>
    <meta property="og:description" content="Show where Atlantic storm tracks and wind swaths overlap, spreading lines along their length and polygons over their area." />
    <meta property="og:category" content="Heatmaps & Clusters" />
    <meta property="og:order" content="3" />
    <meta property="og:created" content="2026-11-21" />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='../../dist/maplibre-gl.css' />

    <style>
        body { margin: 0; padding: 0; font: 13px/1.4 system-ui, sans-serif; }
        html, body, #map { height: 100%; }
        #panel {
            position: absolute; top: 10px; left: 10px; padding: 10px 12px;
            background: rgba(255, 255, 255, 0.95); border-radius: 6px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }
        .row { margin: 4px 0 10px; }
        .row:last-child { margin-bottom: 0; }
        .row label { display: block; font-weight: 600; margin-bottom: 4px; }
        .seg { display: flex; gap: 4px; }
        .seg button { padding: 4px 8px; border: 1px solid #bbb; background: #fff; border-radius: 4px; cursor: pointer; font: inherit; }
        .seg button.on { background: #222; color: #fff; border-color: #222; }
    </style>
</head>
<body>
<div id="map"></div>
<div id="panel">
    <div class="row">
        <label>Atlantic storms, 2009–2026</label>
        <div class="seg" id="data">
            <button data-layer="tracks" class="on">Tracks (lines)</button>
            <button data-layer="swaths">Wind swaths (polygons)</button>
        </div>
    </div>
    <div class="row">
        <label>heatmap-geometry</label>
        <div class="seg" id="geometry">
            <button data-geometry="shapes" class="on">shapes</button>
            <button data-geometry="vertices">vertices</button>
        </div>
    </div>
</div>

<script type="module">
    import * as maplibregl from '../../dist/maplibre-gl-dev.mjs';

    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/positron',
        center: [-72, 30],
        zoom: 3.3
    });

    map.on('load', () => {
        const firstLabel = map.getStyle().layers.find(layer => layer.type === 'symbol').id;

        // Tracks and swaths derived from NOAA National Hurricane Center best-track data.
        map.addSource('tracks', {type: 'geojson', data: '../../docs/assets/atlantic-storm-tracks.geojson'});
        map.addSource('swaths', {type: 'geojson', data: '../../docs/assets/atlantic-wind-swaths.geojson'});

        // With `shapes`, a track adds its weight times the intensity all along its length, so an
        // intensity of 1/10 colours a spot crossed by 10 tracks at the top of the ramp.
        map.addLayer({
            id: 'tracks',
            type: 'heatmap',
            source: 'tracks',
            layout: {'heatmap-geometry': 'shapes'},
            paint: {
                'heatmap-radius': 20,
                'heatmap-intensity': 1 / 10,
                'heatmap-opacity': 0.85
            }
        }, firstLabel);

        // A swath adds its weight times the intensity over its whole area: here, 30 overlapping
        // tropical-storm swaths reach the top of the ramp.
        map.addLayer({
            id: 'swaths',
            type: 'heatmap',
            source: 'swaths',
            filter: ['==', ['get', 'wind_kt'], 34],
            layout: {'heatmap-geometry': 'shapes', 'visibility': 'none'},
            paint: {
                'heatmap-radius': 20,
                'heatmap-intensity': 1 / 30,
                'heatmap-opacity': 0.85
            }
        }, firstLabel);
    });

    function choose(groupId, apply) {
        const buttons = document.querySelectorAll(`#${groupId} button`);
        for (const button of buttons) {
            button.addEventListener('click', () => {
                for (const other of buttons) other.classList.toggle('on', other === button);
                apply(button.dataset);
            });
        }
    }

    choose('data', ({layer}) => {
        map.setLayoutProperty('tracks', 'visibility', layer === 'tracks' ? 'visible' : 'none');
        map.setLayoutProperty('swaths', 'visibility', layer === 'swaths' ? 'visible' : 'none');
    });

    choose('geometry', ({geometry}) => {
        map.setLayoutProperty('tracks', 'heatmap-geometry', geometry);
        map.setLayoutProperty('swaths', 'heatmap-geometry', geometry);
    });
</script>
</body>
</html>

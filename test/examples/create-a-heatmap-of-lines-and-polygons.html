<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create a heatmap of lines and polygons</title>
    <meta property="og:description" content="Show where Atlantic storm tracks and wind swaths overlap, spreading lines along their length and polygons over their area." />
    <meta property="og:category" content="Heatmaps & Clusters" />
    <meta property="og:order" content="3" />
    <meta property="og:created" content="2026-11-21" />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='../../dist/maplibre-gl.css' />

    <style>
        body { margin: 0; padding: 0; font: 13px/1.4 system-ui, sans-serif; }
        html, body, #map { height: 100%; }
        #panel {
            position: absolute; top: 10px; left: 10px; width: 270px; max-height: calc(100% - 40px); overflow-y: auto;
            padding: 10px 12px; background: rgba(255, 255, 255, 0.95); border-radius: 6px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }
        summary { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: #666; margin: 12px 0 4px; border-top: 1px solid #ddd; padding-top: 10px; cursor: pointer; }
        .row { margin: 4px 0 10px; }
        .row:last-child { margin-bottom: 0; }
        .row label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 4px; }
        .row label output { font-weight: 400; color: #555; }
        .seg { display: flex; gap: 4px; }
        .seg button { flex: 1; padding: 4px 6px; border: 1px solid #bbb; background: #fff; border-radius: 4px; cursor: pointer; font: inherit; }
        .seg button.on { background: #222; color: #fff; border-color: #222; }
        input[type=range], select { width: 100%; margin: 0; }
        #ramp { height: 8px; border-radius: 2px; margin-top: 6px; }
    </style>
</head>
<body>
<div id="map"></div>
<div id="panel">
    <div class="row">
        <label>Atlantic storms, 2009–2026</label>
        <div class="seg" id="data">
            <button data-layer="tracks" class="on">Tracks (lines)</button>
            <button data-layer="swaths">Swaths (polygons)</button>
        </div>
    </div>
    <div class="row">
        <label>heatmap-geometry</label>
        <div class="seg" id="geometry">
            <button data-geometry="shapes" class="on">shapes</button>
            <button data-geometry="vertices">vertices</button>
        </div>
    </div>

    <details id="appearance" open>
    <summary>Appearance</summary>
    <div class="row">
        <label for="radius">Radius <output id="radius-value"></output></label>
        <input id="radius" type="range" min="1" max="60" step="1">
    </div>
    <div class="row">
        <label for="top">Top colour at <output id="top-value"></output></label>
        <input id="top" type="range" min="1" max="60" step="1">
    </div>
    <div class="row">
        <label for="opacity">Opacity <output id="opacity-value"></output></label>
        <input id="opacity" type="range" min="0" max="1" step="0.05">
    </div>
    <div class="row">
        <label>Weight</label>
        <div class="seg" id="weight">
            <button data-weight="equal" class="on">Every storm 1</button>
            <button data-weight="category">Peak category</button>
        </div>
    </div>
    <div class="row">
        <label for="colors">Colours</label>
        <select id="colors">
            <option value="default">Default</option>
            <option value="fire">Fire</option>
            <option value="viridis">Viridis</option>
            <option value="blues">Blues</option>
        </select>
        <div id="ramp"></div>
    </div>
    </details>
</div>

<script type="module">
    import * as maplibregl from '../../dist/maplibre-gl-dev.mjs';

    const LAYERS = ['tracks', 'swaths'];

    // Each layer keeps its own radius, scale and opacity, since tracks and swaths read best with
    // different values. `top` is the density that reaches the top of the colour ramp: with
    // `heatmap-geometry: shapes`, a long line or a polygon adds weight times intensity, so an
    // intensity of 1 / top colours a spot covered by `top` storms of weight 1 at the top.
    const settings = {
        tracks: {radius: 20, top: 10, opacity: 0.85},
        swaths: {radius: 20, top: 30, opacity: 0.85}
    };
    let current = 'tracks';

    const WEIGHTS = {
        equal: 1,
        // Tropical storms count 0.5 and a category 5 hurricane counts 3.
        category: ['+', 0.5, ['*', 0.5, ['get', 'max_category']]]
    };

    const RAMPS = {
        default: undefined,
        fire: ['interpolate', ['linear'], ['heatmap-density'],
            0, 'rgba(255, 255, 178, 0)', 0.15, '#fed976', 0.4, '#fd8d3c', 0.7, '#e31a1c', 1, '#800026'],
        viridis: ['interpolate', ['linear'], ['heatmap-density'],
            0, 'rgba(68, 1, 84, 0)', 0.1, '#440154', 0.35, '#31688e', 0.6, '#35b779', 1, '#fde725'],
        blues: ['interpolate', ['linear'], ['heatmap-density'],
            0, 'rgba(222, 235, 247, 0)', 0.2, '#c6dbef', 0.5, '#6baed6', 0.8, '#2171b5', 1, '#08306b']
    };

    const RAMP_PREVIEWS = {
        default: 'linear-gradient(to right, rgba(0,0,255,0), royalblue 10%, cyan 30%, lime 50%, yellow 70%, red)',
        fire: 'linear-gradient(to right, rgba(255,255,178,0), #fed976 15%, #fd8d3c 40%, #e31a1c 70%, #800026)',
        viridis: 'linear-gradient(to right, rgba(68,1,84,0), #440154 10%, #31688e 35%, #35b779 60%, #fde725)',
        blues: 'linear-gradient(to right, rgba(222,235,247,0), #c6dbef 20%, #6baed6 50%, #2171b5 80%, #08306b)'
    };

    // Leave the appearance controls folded on small screens, so the map stays visible.
    if (window.innerWidth < 700) document.getElementById('appearance').open = false;

    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/positron',
        center: [-72, 30],
        zoom: 3.3
    });

    map.on('load', () => {
        const firstLabel = map.getStyle().layers.find(layer => layer.type === 'symbol').id;

        // Tracks and swaths derived from NOAA National Hurricane Center best-track data.
        map.addSource('tracks', {type: 'geojson', data: '../../docs/assets/atlantic-storm-tracks.geojson'});
        map.addSource('swaths', {type: 'geojson', data: '../../docs/assets/atlantic-wind-swaths.geojson'});

        for (const id of LAYERS) {
            const {radius, top, opacity} = settings[id];
            map.addLayer({
                id,
                type: 'heatmap',
                source: id,
                // The swaths file holds 34, 50 and 64 kt swaths; show the tropical-storm ones.
                ...(id === 'swaths' ? {filter: ['==', ['get', 'wind_kt'], 34]} : {}),
                layout: {'heatmap-geometry': 'shapes', 'visibility': id === current ? 'visible' : 'none'},
                paint: {
                    'heatmap-radius': radius,
                    'heatmap-intensity': 1 / top,
                    'heatmap-opacity': opacity
                }
            }, firstLabel);
        }

        wireControls();
        showSettings();
    });

    /** Moves the sliders to the visible layer's settings. */
    function showSettings() {
        const {radius, top, opacity} = settings[current];
        document.getElementById('radius').value = radius;
        document.getElementById('top').value = top;
        document.getElementById('opacity').value = opacity;
        document.getElementById('radius-value').textContent = `${radius} px`;
        document.getElementById('top-value').textContent = `${top} storms`;
        document.getElementById('opacity-value').textContent = opacity.toFixed(2);
    }

    function choose(groupId, apply) {
        const buttons = document.querySelectorAll(`#${groupId} button`);
        for (const button of buttons) {
            button.addEventListener('click', () => {
                for (const other of buttons) other.classList.toggle('on', other === button);
                apply(button.dataset);
            });
        }
    }

    function slider(id, apply) {
        document.getElementById(id).addEventListener('input', (event) => {
            apply(Number(event.target.value));
            showSettings();
        });
    }

    function wireControls() {
        choose('data', ({layer}) => {
            current = layer;
            for (const id of LAYERS) map.setLayoutProperty(id, 'visibility', id === current ? 'visible' : 'none');
            showSettings();
        });

        choose('geometry', ({geometry}) => {
            for (const id of LAYERS) map.setLayoutProperty(id, 'heatmap-geometry', geometry);
        });

        slider('radius', (radius) => {
            settings[current].radius = radius;
            map.setPaintProperty(current, 'heatmap-radius', radius);
        });

        slider('top', (top) => {
            settings[current].top = top;
            map.setPaintProperty(current, 'heatmap-intensity', 1 / top);
        });

        slider('opacity', (opacity) => {
            settings[current].opacity = opacity;
            map.setPaintProperty(current, 'heatmap-opacity', opacity);
        });

        choose('weight', ({weight}) => {
            for (const id of LAYERS) map.setPaintProperty(id, 'heatmap-weight', WEIGHTS[weight]);
        });

        const colors = document.getElementById('colors');
        const ramp = document.getElementById('ramp');
        ramp.style.background = RAMP_PREVIEWS.default;
        colors.addEventListener('change', () => {
            for (const id of LAYERS) map.setPaintProperty(id, 'heatmap-color', RAMPS[colors.value]);
            ramp.style.background = RAMP_PREVIEWS[colors.value];
        });
    }
</script>
</body>
</html>
